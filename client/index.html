<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/client/styles.css" />
        <script src="/client/script.js" defer></script>
        <title>PJSK Gacha Simulator</title>
    </head>
    <body>
        <header>
            <h1>PJSK Gacha Simulator</h1>
            <p>
                This is a Gacha simulator for Project Sekai, developed by dangduomg<br />
                Click on "Pull 1" or "Pull 10" to get started<br />
                Gacha card pool is based on the first gacha (Release Celebration Gacha)
            </p>
        </header>
        <main>
            <section id="gacha" class="ui-card">
                <div id="result">Result will be displayed here</div>
                <div>
                    <button id="pull-1">Pull 1</button>
                    <button id="pull-10">Pull 10</button>
                </div>
            </section>
        </main>

        <template id="cards-template">
            <ul class="cards"></ul>
        </template>
        <template id="card-template">
            <ul class="card">
                <li>Rarity: <span data-field="rarity"></span></li>
                <li>Attribute: <span data-field="attribute"></span></li>
                <li>Character: <span data-field="character"></span></li>
                <li>Card name: <span data-field="name"></span></li>
            </ul>
        </template>
    </body>
</html>
